name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve version
        id: ver
        run: |
          PUB=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          NAME=${PUB%%+*}
          NUMBER=${PUB##*+}
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then NAME=${GITHUB_REF_NAME#v}; fi
          [[ "$NUMBER" == "$PUB" ]] && NUMBER=1
          # build number 至少为 run number，保证每次发布递增
          if (( GITHUB_RUN_NUMBER > NUMBER )); then NUMBER=$GITHUB_RUN_NUMBER; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::缺少 ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ARGS="--release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.number }}"
          flutter build apk $ARGS
          cp build/app/outputs/flutter-apk/app-release.apk "chengxiang-v${{ steps.ver.outputs.name }}.apk"
          flutter build apk $ARGS --split-per-abi
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/app-\(.*\)-release.apk/\1/')
            cp "$f" "chengxiang-v${{ steps.ver.outputs.name }}-$abi.apk"
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          name: 城向 v${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: chengxiang-v*.apk
